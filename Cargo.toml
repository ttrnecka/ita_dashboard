[package]
name = "ita_dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio","image"] }
# iced_aw = { version = "0.13.0", features = ["card"] }
chrono = "0.4"

tokio = { version = "1", features = ["full"] }
winit = "0.30"

# For Oracle access (Oracle DB client)
# oracle = { version = "0.5", features = ["chrono"] }
serde = {version = "1.0.228", features = ["derive"] }
r2d2 = "0.8.10"
r2d2-oracle = { version = "0.7.0", features = ["chrono"] }
toml = "0.9.8"
thiserror = "2.0.17"
anyhow = "1.0.100"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0        # no optimization → fastest compile
incremental = true   # reuse previous compilation work
codegen-units = 256  # more parallelism → faster builds
lto = false          # disable link-time optimization
